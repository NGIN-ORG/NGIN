name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "Documentation/**"
      - "Tools/scripts/check-docs.ps1"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "Documentation/**"
      - "Tools/scripts/check-docs.ps1"
      - "**/*.md"

permissions:
  contents: read

jobs:
  check:
    name: Links and current terminology
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check documentation
        shell: pwsh
        run: ./Tools/scripts/check-docs.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Documentation/package-lock.json

      - name: Install documentation site dependencies
        working-directory: Documentation
        run: npm ci

      - name: Build documentation site
        working-directory: Documentation
        run: npm run build

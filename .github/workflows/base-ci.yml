name: NGIN.Base CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/base-ci.yml"
      - ".github/workflows/crypto-fuzz-ci.yml"
      - ".github/workflows/crypto-provider-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Packages/NGIN.Base/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/base-ci.yml"
      - ".github/workflows/crypto-fuzz-ci.yml"
      - ".github/workflows/crypto-provider-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Packages/NGIN.Base/**"

permissions:
  contents: read

concurrency:
  group: base-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            cc: cl
            cxx: cl
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure static tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-platform
          -GNinja
          -DNGIN_BASE_BUILD_STATIC=ON
          -DNGIN_BASE_BUILD_SHARED=OFF
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build static tests and public headers
        run: cmake --build build/ngin-base-platform --parallel 2

      - name: Run tests
        run: ctest --test-dir build/ngin-base-platform --output-on-failure -C Release

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: base-platform-logs-${{ matrix.os }}-${{ matrix.cxx }}
          path: build/ngin-base-platform/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build
      - name: Configure sanitizers
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-asan
          -GNinja
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DNGIN_BASE_ENABLE_ASAN=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitizer tests
        run: cmake --build build/ngin-base-asan --parallel 2
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/ngin-base-asan --output-on-failure

  thread-sanitizer:
    name: Linux ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build
      - name: Configure ThreadSanitizer
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-tsan
          -GNinja
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DNGIN_BASE_ENABLE_TSAN=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build concurrency tests
        run: >
          cmake --build build/ngin-base-tsan --parallel 2 --target
          Sync_AtomicConditionTests
          Sync_PrimitivesTests
          Containers_ConcurrentHashMapTests
          Containers_ConcurrentHashMapCoverageTests
          Containers_ConcurrentHashMapStressTests
      - name: Run concurrency tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >
          ctest --test-dir build/ngin-base-tsan --output-on-failure
          -R "^Base\.(Sync|Containers\.ConcurrentHashMap)\."

  simd-x64:
    name: SIMD ${{ matrix.isa }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: SSE2
            flags: -msse2
          - isa: AVX2
            flags: -mavx2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure SIMD build
        env:
          CXXFLAGS: ${{ matrix.flags }}
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-simd
          -GNinja
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=ON
          -DNGIN_BENCH_USE_GLM=OFF
          -DNGIN_BENCH_USE_SIMDJSON=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build SIMD tests and diagnostic benchmark
        run: >
          cmake --build build/ngin-base-simd --parallel 2 --target
          SIMD_VecScalarTestsTests
          SIMD_AVX512RuntimeTestsTests
          SIMDFastMathBench
          SIMDRuntimeDispatchBench
      - name: Run SIMD tests
        run: ctest --test-dir build/ngin-base-simd --output-on-failure -R "^Base\.SIMD\."
      - name: Run equal-workload SIMD diagnostic benchmark
        run: |
          ./build/ngin-base-simd/benchmarks/SIMDFastMathBench
          ./build/ngin-base-simd/benchmarks/SIMDRuntimeDispatchBench

  simd-arm64:
    name: ARM64 NEON
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure native ARM SIMD build
        env:
          CXXFLAGS: -march=armv8-a+simd
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-neon
          -GNinja
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=ON
          -DNGIN_BENCH_USE_GLM=OFF
          -DNGIN_BENCH_USE_SIMDJSON=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and run native ARM SIMD tests
        run: |
          cmake --build build/ngin-base-neon --parallel 2 --target \
            SIMD_VecScalarTestsTests \
            SIMD_AVX512RuntimeTestsTests \
            SIMDFastMathBench \
            SIMDRuntimeDispatchBench
          ctest --test-dir build/ngin-base-neon --output-on-failure -R "^Base\.SIMD\."
          ./build/ngin-base-neon/benchmarks/SIMDFastMathBench
          ./build/ngin-base-neon/benchmarks/SIMDRuntimeDispatchBench

  shared-and-install:
    name: Shared consumers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure shared library
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-shared
          -GNinja
          -DNGIN_BASE_BUILD_STATIC=OFF
          -DNGIN_BASE_BUILD_SHARED=ON
          -DNGIN_BASE_BUILD_TESTS=OFF
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/ngin-base-install
      - name: Build and install shared library
        run: |
          cmake --build build/ngin-base-shared --parallel 2
          cmake --install build/ngin-base-shared --config Release
      - name: Configure build-tree consumers
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base/consumer-tests
          -B build/ngin-base-buildtree-consumer
          -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DNGINBase_DIR=${{ github.workspace }}/build/ngin-base-shared
      - name: Build and run build-tree consumer matrix
        run: |
          cmake --build build/ngin-base-buildtree-consumer --parallel 2
          ctest --test-dir build/ngin-base-buildtree-consumer --output-on-failure
      - name: Configure installed consumer
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base/consumer-tests
          -B build/ngin-base-consumer
          -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/ngin-base-install
      - name: Build and run installed consumer
        run: |
          cmake --build build/ngin-base-consumer --parallel 2
          ctest --test-dir build/ngin-base-consumer --output-on-failure

  selective-components:
    name: Selective component package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure Foundation-only package
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-foundation
          -GNinja
          -DNGIN_BASE_BUILD_COMPONENTS=Foundation
          -DNGIN_BASE_BUILD_TESTS=OFF
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/ngin-base-foundation-install
      - name: Build and install Foundation-only package
        run: |
          cmake --build build/ngin-base-foundation --parallel 2
          cmake --install build/ngin-base-foundation
      - name: Build and run Foundation-only consumers
        run: |
          cmake -S Dependencies/NGIN/NGIN.Base/consumer-tests -B build/ngin-base-foundation-consumer -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/ngin-base-foundation-install -DNGIN_BASE_CONSUMER_COMPONENTS=Foundation
          cmake --build build/ngin-base-foundation-consumer --parallel 2
          ctest --test-dir build/ngin-base-foundation-consumer --output-on-failure
      - name: Verify Net dependency closure
        run: |
          cmake -S Dependencies/NGIN/NGIN.Base -B build/ngin-base-net -GNinja -DNGIN_BASE_BUILD_COMPONENTS=Net -DNGIN_BASE_BUILD_TESTS=OFF -DNGIN_BASE_BUILD_EXAMPLES=OFF -DNGIN_BASE_BUILD_BENCHMARKS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ngin-base-net --parallel 2

  static-analysis:
    name: Clang-Tidy component sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build
      - name: Configure clang-tidy build
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-tidy
          -GNinja
          -DNGIN_BASE_BUILD_COMPONENTS=Net
          -DNGIN_BASE_BUILD_TESTS=OFF
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          "-DCMAKE_CXX_CLANG_TIDY=clang-tidy;--checks=-*,clang-analyzer-*;--warnings-as-errors=*"
          -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy while compiling
        run: cmake --build build/ngin-base-tidy --parallel 2

  coverage:
    name: GCC coverage report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcovr ninja-build
      - name: Configure coverage build
        run: >
          cmake
          -S Dependencies/NGIN/NGIN.Base
          -B build/ngin-base-coverage
          -GNinja
          -DNGIN_BASE_ENABLE_COVERAGE=ON
          -DNGIN_BASE_BUILD_TESTS=ON
          -DNGIN_BASE_BUILD_EXAMPLES=OFF
          -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build representative coverage suites
        run: >
          cmake --build build/ngin-base-coverage --parallel 2 --target
          Time_PlatformTimeTests
          Serialization_JsonParserTestsTests
          Crypto_EncodingTests
          Net_AddressTests
      - name: Run representative coverage suites
        run: >
          ctest --test-dir build/ngin-base-coverage --output-on-failure
          -R "^Base\.(Time\.PlatformTime|Serialization\.JsonParser|Crypto\.Encoding|Net\.Address)\."
      - name: Generate coverage reports
        run: |
          gcovr --root Dependencies/NGIN/NGIN.Base --filter Dependencies/NGIN/NGIN.Base/src --exclude build --xml-pretty --output build/ngin-base-coverage/coverage.xml
          gcovr --root Dependencies/NGIN/NGIN.Base --filter Dependencies/NGIN/NGIN.Base/src --exclude build --html-details --output build/ngin-base-coverage/coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: ngin-base-coverage
          path: |
            build/ngin-base-coverage/coverage.xml
            build/ngin-base-coverage/coverage*.html
          retention-days: 14

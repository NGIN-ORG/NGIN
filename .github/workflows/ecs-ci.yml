name: NGIN.ECS CI

on:
  push:
    paths:
      - ".github/workflows/ecs-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Dependencies/NGIN/NGIN.ECS/**"
      - "Packages/NGIN.Base/**"
      - "Packages/NGIN.ECS/**"
      - "Examples/Hello.ECS/**"
      - "NGIN.ngin"
  pull_request:
    paths:
      - ".github/workflows/ecs-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Dependencies/NGIN/NGIN.ECS/**"
      - "Packages/NGIN.Base/**"
      - "Packages/NGIN.ECS/**"
      - "Examples/Hello.ECS/**"
      - "NGIN.ngin"
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: >
          cmake -S Dependencies/NGIN/NGIN.ECS -B build/ecs
          -G "Ninja Multi-Config"
          -DNGIN_ECS_BUILD_TESTS=ON
          -DNGIN_ECS_BUILD_EXAMPLES=ON
          -DNGIN_ECS_BUILD_BENCHMARKS=ON
      - name: Debug
        run: |
          cmake --build build/ecs --config Debug --parallel
          ctest --test-dir build/ecs -C Debug --output-on-failure
      - name: Release
        run: |
          cmake --build build/ecs --config Release --parallel
          ctest --test-dir build/ecs -C Release --output-on-failure
          build/ecs/benchmarks/Release/ECSBenchmarks.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ecs-windows-msvc-logs
          path: build/ecs/Testing/Temporary

  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macos-appleclang
            os: macos-14
            cc: clang
            cxx: clang++
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -S Dependencies/NGIN/NGIN.ECS -B build/ecs
          -G "Ninja Multi-Config"
          -DNGIN_ECS_BUILD_TESTS=ON
          -DNGIN_ECS_BUILD_EXAMPLES=ON
          -DNGIN_ECS_BUILD_BENCHMARKS=ON
      - name: Debug
        run: |
          cmake --build build/ecs --config Debug --parallel
          ctest --test-dir build/ecs -C Debug --output-on-failure
      - name: Release
        run: |
          cmake --build build/ecs --config Release --parallel
          ctest --test-dir build/ecs -C Release --output-on-failure
          ./build/ecs/benchmarks/Release/ECSBenchmarks
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ecs-${{ matrix.name }}-logs
          path: build/ecs/Testing/Temporary

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -S Dependencies/NGIN/NGIN.ECS -B build/ecs-sanitized
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DNGIN_ECS_BUILD_TESTS=ON
          -DNGIN_ECS_BUILD_EXAMPLES=ON
      - name: Build and test
        run: |
          cmake --build build/ecs-sanitized --parallel
          ctest --test-dir build/ecs-sanitized --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ecs-sanitizer-logs
          path: build/ecs-sanitized/Testing/Temporary

  ngin-package-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build NGIN CLI
        run: |
          cmake --preset dev
          cmake --build build/dev --target ngin_cli --parallel
      - name: Validate and build plain ECS consumer
        run: |
          ./build/dev/Tools/NGIN.CLI/ngin validate --project Examples/Hello.ECS/Hello.ECS.nginproj --profile Debug
          ./build/dev/Tools/NGIN.CLI/ngin build --project Examples/Hello.ECS/Hello.ECS.nginproj --profile Debug --output build/manual/Hello.ECS

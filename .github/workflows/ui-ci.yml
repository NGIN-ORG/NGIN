name: NGIN.UI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Examples/NGIN.UI.*/**"
      - "Packages/NGIN.UI*/**"
      - "Packages/SDL3/**"
      - "docs/guides/ngin-ui*.md"
      - "docs/policies/ngin-ui*.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ui-ci.yml"
      - "Dependencies/NGIN/NGIN.Base/**"
      - "Examples/NGIN.UI.*/**"
      - "Packages/NGIN.UI*/**"
      - "Packages/SDL3/**"
      - "docs/guides/ngin-ui*.md"
      - "docs/policies/ngin-ui*.md"

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  core:
    name: UI core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure tests and benchmarks
        shell: bash
        run: >
          cmake -S Packages/NGIN.UI -B build/ui-ci
          -DCMAKE_BUILD_TYPE=Release
          -DNGIN_UI_BUILD_TESTS=ON
          -DNGIN_UI_BUILD_BENCHMARKS=ON

      - name: Build tests and benchmarks
        shell: bash
        run: >
          cmake --build build/ui-ci --config Release
          --target NGINUITests NGINUIBenchmarks

      - name: Run structural, visual, and budget tests
        shell: bash
        run: ctest --test-dir build/ui-ci -C Release --output-on-failure

      - name: Check public API documentation
        shell: bash
        run: >
          python Packages/NGIN.UI/tools/check_public_api_docs.py
          Packages/NGIN.UI/include/NGIN/UI
          Packages/NGIN.UI.Hosting/include/NGIN/UI
          Packages/NGIN.UI.Backend.SDL3/include/NGIN/UI
          Packages/NGIN.UI.Accessibility.Windows/include/NGIN/UI

      - name: Run Windows UI Automation provider test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S Packages/NGIN.UI.Accessibility.Windows \
            -B build/ui-accessibility-windows \
            -DNGIN_UI_ACCESSIBILITY_WINDOWS_BUILD_TESTS=ON
          cmake --build build/ui-accessibility-windows --config Release \
            --target NGINUIAccessibilityWindowsTests
          ctest --test-dir build/ui-accessibility-windows -C Release \
            --output-on-failure

      - name: Install NGIN.Base
        shell: bash
        run: |
          cmake -S Dependencies/NGIN/NGIN.Base -B build/ui-install/base \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/ui-prefix" \
            -DNGIN_BASE_BUILD_TESTS=OFF \
            -DNGIN_BASE_BUILD_EXAMPLES=OFF \
            -DNGIN_BASE_BUILD_BENCHMARKS=OFF
          cmake --build build/ui-install/base --config Release --target install

      - name: Install NGIN.UI contracts
        shell: bash
        run: |
          cmake -S Packages/NGIN.UI -B build/ui-install/ui \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/ui-prefix" \
            -DCMAKE_PREFIX_PATH="$PWD/build/ui-prefix" \
            -DNGIN_UI_ENABLE_NATIVE_TEXT=OFF
          cmake --build build/ui-install/ui --config Release --target install

      - name: Build external install consumer
        shell: bash
        run: |
          cmake -S Packages/NGIN.UI/tests/install-consumer \
            -B build/ui-install/consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/ui-prefix"
          cmake --build build/ui-install/consumer --config Release
          ctest --test-dir build/ui-install/consumer -C Release --output-on-failure

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ctest-${{ matrix.os }}
          path: build/ui-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  gallery:
    name: Gallery products (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux native-smoke prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build xvfb xauth mesa-vulkan-drivers

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build NGIN CLI
        run: |
          cmake --preset dev
          cmake --build build/dev --target ngin_cli

      - name: Build Release Gallery products
        shell: bash
        run: |
          cli=./build/dev/Tools/NGIN.CLI/ngin
          if [ "$RUNNER_OS" = "Windows" ]; then cli="${cli}.exe"; fi
          "$cli" build --project Examples/NGIN.UI.Gallery/NGIN.UI.Gallery.nginproj --profile Release --output build/release/NGIN.UI.Gallery-0.2.0
          "$cli" build --project Examples/NGIN.UI.Gallery.Hosted/NGIN.UI.Gallery.Hosted.nginproj --profile Release --output build/release/NGIN.UI.Gallery.Hosted-0.2.0
          "$cli" build --project Examples/NGIN.UI.Gallery.Tests/NGIN.UI.Gallery.Tests.nginproj --profile Release --output build/release/NGIN.UI.Gallery.Tests-0.2.0

      - name: Run headless Gallery checks
        shell: bash
        run: |
          executable=./build/release/NGIN.UI.Gallery.Tests-0.2.0/bin/NGIN.UI.Gallery.Tests
          if [ "$RUNNER_OS" = "Windows" ]; then executable="${executable}.exe"; fi
          "$executable"

      - name: Run native Gallery smoke checks
        shell: bash
        run: |
          gallery=./build/release/NGIN.UI.Gallery-0.2.0/bin/NGIN.UI.Gallery
          hosted=./build/release/NGIN.UI.Gallery.Hosted-0.2.0/bin/NGIN.UI.Gallery.Hosted
          if [ "$RUNNER_OS" = "Windows" ]; then
            gallery="${gallery}.exe"
            hosted="${hosted}.exe"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum "$gallery" --smoke
            xvfb-run --auto-servernum "$hosted" --smoke
          else
            "$gallery" --smoke
            "$hosted" --smoke
          fi

      - name: Publish versioned demo
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build/dev/Tools/NGIN.CLI/ngin.exe publish demo --project Examples/NGIN.UI.Gallery/NGIN.UI.Gallery.nginproj --profile Release --output build/release/NGIN.UI.Gallery-0.2.0

      - name: Upload versioned demo
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: NGIN.UI.Gallery-0.2.0-windows
          path: dist/NGIN.UI.Gallery-0.2.0-demo.zip
          if-no-files-found: error
          retention-days: 14

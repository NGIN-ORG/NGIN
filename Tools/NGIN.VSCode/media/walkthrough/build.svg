<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title description">
  <title id="title">NGIN Project Actions</title>
  <desc id="description">The compact NGIN status item opens a searchable action list with Build, Run, Debug, Test, and build-context selections.</desc>
  <style>
    .bg{fill:#f3f3f3}.panel{fill:#fff;stroke:#c8c8c8}.bar{fill:#e5e5e5}.text{fill:#242424;font:15px sans-serif}.muted{fill:#616161;font:13px sans-serif}.accent{fill:#007acc}.line{stroke:#c8c8c8}
    @media(prefers-color-scheme:dark){.bg{fill:#1e1e1e}.panel{fill:#252526;stroke:#4b4b4b}.bar{fill:#181818}.text{fill:#f0f0f0}.muted{fill:#b7b7b7}.accent{fill:#4daafc}.line{stroke:#4b4b4b}}
    @media(forced-colors:active){.bg,.panel,.bar{fill:Canvas}.panel,.line{stroke:CanvasText}.text,.muted{fill:CanvasText}.accent{fill:Highlight}}
  </style>
  <rect class="bg" width="640" height="260" rx="8"/>
  <rect class="panel" x="116" y="20" width="408" height="198" rx="5"/>
  <text class="text" x="142" y="50" font-weight="600">NGIN: Hello.Native</text><text class="muted" x="142" y="72">Project owning the active file</text>
  <line class="line" x1="140" y1="84" x2="500" y2="84"/>
  <text class="muted" x="142" y="106">LIFECYCLE</text>
  <text class="text" x="158" y="130">⚒  Build Project</text><text class="muted" x="402" y="130">Hello.Native</text>
  <text class="text" x="158" y="155">▶  Run Project</text><text class="text" x="326" y="155">◉  Debug Project</text>
  <text class="muted" x="142" y="184">BUILD CONTEXT</text>
  <text class="text" x="158" y="207">Select Configuration</text><text class="accent" x="427" y="207">Debug</text>
  <rect class="bar" x="0" y="229" width="640" height="31"/>
  <text class="text" x="18" y="250">◇ Hello.Native · Debug</text><text class="muted" x="518" y="250">F5 Debug</text>
</svg>
